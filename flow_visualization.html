<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LKG Pipeline Flow Visualization</title>
    <!-- Modern Premium Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0b10;
            --bg-glass: rgba(18, 20, 32, 0.7);
            --bg-glass-hover: rgba(26, 29, 46, 0.85);
            --primary: #6c5ce7;
            --primary-glow: rgba(108, 92, 231, 0.35);
            --secondary: #00dec9;
            --secondary-glow: rgba(0, 222, 201, 0.3);
            --accent: #ff7675;
            --accent-glow: rgba(255, 118, 117, 0.25);
            --text-main: #f1f2f6;
            --text-muted: #8b92b6;
            --border-color: rgba(255, 255, 255, 0.06);
            --border-active: rgba(108, 92, 231, 0.5);
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            --node-width: 140px;
            --node-height: 80px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(108, 92, 231, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 222, 201, 0.06) 0%, transparent 45%);
            background-attachment: fixed;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            border-bottom: 1px solid var(--border-color);
            background: rgba(10, 11, 16, 0.5);
            backdrop-filter: blur(12px);
            z-index: 100;
        }

        .logo-section h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, #fff 30%, var(--primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .logo-section p {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .toggle-container {
            display: flex;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            padding: 4px;
        }

        .toggle-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 10px 24px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 26px;
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .toggle-btn.active {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 4px 15px var(--primary-glow);
        }

        .main-container {
            display: flex;
            flex: 1;
            height: calc(100vh - 85px);
            overflow: hidden;
            position: relative;
        }

        /* Side timeline column */
        .timeline-panel {
            width: 380px;
            border-right: 1px solid var(--border-color);
            background: rgba(8, 9, 14, 0.4);
            backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-header {
            padding: 24px;
            border-bottom: 1px solid var(--border-color);
        }

        .panel-header h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 18px;
            font-weight: 700;
        }

        .step-list {
            flex: 1;
            overflow-y: auto;
            padding: 16px 24px;
        }

        /* Custom scrollbar */
        .step-list::-webkit-scrollbar, .details-content::-webkit-scrollbar {
            width: 6px;
        }
        .step-list::-webkit-scrollbar-thumb, .details-content::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        .step-item {
            display: flex;
            gap: 16px;
            padding: 14px 16px;
            border-radius: 12px;
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid transparent;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.01);
            position: relative;
        }

        .step-item:hover {
            background: rgba(255, 255, 255, 0.03);
            border-color: rgba(255, 255, 255, 0.05);
        }

        .step-item.active {
            background: rgba(108, 92, 231, 0.08);
            border-color: var(--primary);
            box-shadow: 0 4px 20px rgba(108, 92, 231, 0.05);
        }

        .step-number {
            width: 28px;
            height: 28px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            flex-shrink: 0;
            transition: var(--transition);
            border: 1px solid var(--border-color);
        }

        .step-item.active .step-number {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        .step-text {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .step-title {
            font-size: 14px;
            font-weight: 600;
            line-height: 1.4;
        }

        .step-desc {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* Central canvas area */
        .canvas-area {
            flex: 1;
            position: relative;
            background: rgba(5, 6, 8, 0.8);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* SVG layer for connection lines */
        .svg-connections {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .svg-connections path {
            fill: none;
            stroke: rgba(255, 255, 255, 0.1);
            stroke-width: 2.5;
            transition: var(--transition);
        }

        .svg-connections path.active {
            stroke: var(--primary);
            filter: drop-shadow(0 0 8px var(--primary));
            stroke-dasharray: 8 4;
            animation: flowDash 25s linear infinite;
        }

        .svg-connections path.active.reverse {
            stroke: var(--secondary);
            filter: drop-shadow(0 0 8px var(--secondary));
            animation: flowDashReverse 25s linear infinite;
        }

        @keyframes flowDash {
            to {
                stroke-dashoffset: -1000;
            }
        }

        @keyframes flowDashReverse {
            to {
                stroke-dashoffset: 1000;
            }
        }

        /* Node Graph Layout Grid */
        .graph-container {
            position: relative;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-gap: 50px 60px;
            padding: 40px;
            z-index: 20;
            max-width: 1000px;
            width: 100%;
        }

        .node-card {
            background: var(--bg-glass);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: var(--transition);
            cursor: pointer;
            position: relative;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(8px);
        }

        .node-card:hover {
            border-color: rgba(255, 255, 255, 0.15);
            background: var(--bg-glass-hover);
            transform: translateY(-2px);
        }

        .node-card.active {
            border-color: var(--primary);
            box-shadow: 0 0 20px var(--primary-glow);
            background: rgba(108, 92, 231, 0.15);
        }

        .node-card.active.source {
            border-color: var(--secondary);
            box-shadow: 0 0 20px var(--secondary-glow);
            background: rgba(0, 222, 201, 0.12);
        }

        .node-card.active.target {
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
            background: rgba(255, 118, 117, 0.12);
        }

        .node-label {
            font-family: 'Outfit', sans-serif;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--primary);
            margin-bottom: 6px;
        }

        .node-card.active.source .node-label {
            color: var(--secondary);
        }

        .node-card.active.target .node-label {
            color: var(--accent);
        }

        .node-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            line-height: 1.3;
        }

        .node-desc {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Right inspector details panel */
        .details-panel {
            width: 420px;
            border-left: 1px solid var(--border-color);
            background: rgba(8, 9, 14, 0.5);
            backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .details-content {
            padding: 30px;
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .details-header {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .details-step-num {
            display: inline-block;
            background: var(--primary-glow);
            color: var(--primary);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
            width: fit-content;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border: 1px solid rgba(108, 92, 231, 0.2);
        }

        .details-title {
            font-family: 'Outfit', sans-serif;
            font-size: 20px;
            font-weight: 700;
            line-height: 1.3;
        }

        .details-direction {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.02);
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            font-size: 12px;
            color: var(--text-muted);
        }

        .details-direction .comp-pill {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: 600;
        }

        .details-body {
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-muted);
        }

        .details-body strong {
            color: var(--text-main);
        }

        .code-block {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px;
            font-family: monospace;
            font-size: 12px;
            color: #58ebd3;
            overflow-x: auto;
            line-height: 1.4;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            color: var(--text-muted);
            gap: 12px;
        }

        .empty-state svg {
            width: 48px;
            height: 48px;
            stroke: rgba(255, 255, 255, 0.15);
            stroke-width: 1.5;
            fill: none;
        }

        .badge-type {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 700;
            margin-left: 6px;
            text-transform: uppercase;
        }

        .badge-mongo { background: rgba(0, 222, 201, 0.15); color: var(--secondary); border: 1px solid rgba(0, 222, 201, 0.3); }
        .badge-neo4j { background: rgba(108, 92, 231, 0.15); color: var(--primary); border: 1px solid rgba(108, 92, 231, 0.3); }
        .badge-file { background: rgba(255, 118, 117, 0.15); color: var(--accent); border: 1px solid rgba(255, 118, 117, 0.3); }

        /* Grid specific placements */
        /* Phase 1 Layout Grid positions */
        .p1-doc_ids { grid-column: 1; grid-row: 1; }
        .p1-extract_relations { grid-column: 1; grid-row: 2; }
        .p1-relations_processor { grid-column: 2; grid-row: 2; }
        .p1-mongo_prod { grid-column: 3; grid-row: 1; }
        .p1-relations_extractor { grid-column: 3; grid-row: 2; }
        .p1-rule_resolver { grid-column: 4; grid-row: 1; }
        .p1-fallback_llm { grid-column: 4; grid-row: 2; }
        .p1-post_process { grid-column: 2; grid-row: 3; }
        .p1-laws_dataframe { grid-column: 1; grid-row: 3; }
        .p1-elasticsearch { grid-column: 3; grid-row: 3; }
        .p1-mongo_dev { grid-column: 4; grid-row: 3; }

        /* Phase 2 Layout Grid positions */
        .p2-all_ids { grid-column: 1; grid-row: 1; }
        .p2-build_graph { grid-column: 1; grid-row: 2; }
        .p2-build_graph_app { grid-column: 2; grid-row: 2; }
        .p2-mongo_prod { grid-column: 3; grid-row: 1; }
        .p2-builder { grid-column: 3; grid-row: 2; }
        .p2-prep_service { grid-column: 4; grid-row: 1; }
        .p2-neo4j { grid-column: 4; grid-row: 2; }
        .p2-mongo_dev { grid-column: 4; grid-row: 3; }
        .p2-status_prep { grid-column: 1; grid-row: 3; }
        .p2-coord { grid-column: 2; grid-row: 3; }
        .p2-healer { grid-column: 3; grid-row: 3; }
        .p2-inferred { grid-column: 2; grid-row: 4; }
        .p2-tvpl { grid-column: 3; grid-row: 4; }
        .p2-sync_prep { grid-column: 1; grid-row: 4; }
    </style>
</head>
<body>

    <header>
        <div class="logo-section">
            <h1>CAI Legal Graph</h1>
            <p>Sơ đồ tương tác luồng dữ liệu & dịch vụ hệ thống LKG</p>
        </div>
        <div class="toggle-container">
            <button class="toggle-btn active" id="btn-p1" onclick="switchPhase(1)">Pha 1: Trích xuất Quan hệ</button>
            <button class="toggle-btn" id="btn-p2" onclick="switchPhase(2)">Pha 2: Xây dựng Đồ thị</button>
        </div>
    </header>

    <div class="main-container">
        <!-- Sidebar containing steps timeline -->
        <div class="timeline-panel">
            <div class="panel-header">
                <h2 id="timeline-title">Các bước trích xuất quan hệ</h2>
            </div>
            <div class="step-list" id="step-list-container">
                <!-- Dynamically populated step list -->
            </div>
        </div>

        <!-- Central Visualization Canvas -->
        <div class="canvas-area">
            <!-- SVG paths layer -->
            <svg class="svg-connections" id="svg-layer">
                <!-- Dynamically populated connection lines -->
            </svg>

            <!-- Dynamic Node Grid -->
            <div class="graph-container" id="graph-container">
                <!-- Dynamically populated nodes -->
            </div>
        </div>

        <!-- Right inspector details panel -->
        <div class="details-panel">
            <div class="details-content" id="details-panel-content">
                <div class="empty-state">
                    <svg viewBox="0 0 24 24" stroke="currentColor">
                        <circle cx="12" cy="12" r="9"></circle>
                        <path d="M12 8v4M12 16h.01"></path>
                    </svg>
                    <p>Chọn một bước ở thanh bên để thanh sát chi tiết luồng xử lý và dữ liệu truy vấn.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // High quality data structures matching source_code_analysis.md exactly
        const dataPhase1 = {
            title: "Các bước trích xuất quan hệ (Phase 1)",
            nodes: [
                { id: "A", label: "Tệp tin", name: "doc_ids.json", type: "file", class: "p1-doc_ids" },
                { id: "B", label: "Mã nguồn", name: "extract_relations.py", type: "file", class: "p1-extract_relations" },
                { id: "C", label: "Bộ điều phối", name: "RelationsProcessorService", type: "code", class: "p1-relations_processor" },
                { id: "D", label: "MongoDB PROD", name: "cls_ver2", type: "mongo", class: "p1-mongo_prod" },
                { id: "E", label: "Bộ trích xuất", name: "RelationsExtractor", type: "code", class: "p1-relations_extractor" },
                { id: "E1", label: "Bộ quy tắc", name: "Rule-based Resolver", type: "code", class: "p1-rule_resolver" },
                { id: "F", label: "LLM Fallback", name: "LangExtractFallback LLM", type: "code", class: "p1-fallback_llm" },
                { id: "G", label: "Hậu xử lý", name: "post_process_relations", type: "code", class: "p1-post_process" },
                { id: "H", label: "Bộ nhớ đệm CSV", name: "laws_dataframe", type: "file", class: "p1-laws_dataframe" },
                { id: "I", label: "Elasticsearch", name: "law_documents_t4", type: "mongo", class: "p1-elasticsearch" },
                { id: "J", label: "MongoDB DEV", name: "ie_collection", type: "mongo", class: "p1-mongo_dev" }
            ],
            steps: [
                {
                    id: "1",
                    num: "Bước 1",
                    title: "Đọc đầu vào doc_ids.json",
                    desc: "extract_relations.py đọc danh sách ID văn bản nguồn.",
                    from: "A",
                    to: "B",
                    direction: "forward",
                    details: "Tệp tin <strong>doc_ids.json (A)</strong> cung cấp danh sách các ID văn bản pháp luật cần xử lý cho tệp chạy chính <strong>extract_relations.py (B)</strong> để lọc và phân lô.",
                    code: "with open('doc_ids.json') as f:\n    doc_ids = json.load(f)"
                },
                {
                    id: "2",
                    num: "Bước 2",
                    title: "Khởi tạo điều phối dịch vụ",
                    desc: "extract_relations.py gọi RelationsProcessorService.",
                    from: "B",
                    to: "C",
                    direction: "forward",
                    details: "Bộ chạy chính khởi tạo <strong>RelationsProcessorService (C)</strong> chịu trách nhiệm quản lý vòng đời chạy lô (batch processing), đa luồng song song và lưu checkpoint.",
                    code: "processor = RelationsProcessorService(config)\nprocessor.process_batch(doc_ids)"
                },
                {
                    id: "3a",
                    num: "Bước 3a",
                    title: "Yêu cầu đọc văn bản gốc",
                    desc: "RelationsProcessorService truy vấn MongoDB Production.",
                    from: "C",
                    to: "D",
                    direction: "forward",
                    details: "RelationsProcessorService (C) gửi truy vấn MongoDB Production <strong>cls_ver2 (D)</strong> để tải tài liệu gốc bao gồm trường cây cấu trúc <code>cls_parsing</code> và trường thông tin <code>cls_info</code>.",
                    code: "db.cls_ver2.find(\n    {'cls_ID': {'$in': batch_ids}},\n    {'cls_ID': 1, 'cls_parsing': 1, 'cls_info': 1}\n)"
                },
                {
                    id: "3b",
                    num: "Bước 3b",
                    title: "Trả về dữ liệu văn bản gốc",
                    desc: "MongoDB trả dữ liệu văn bản gốc về RelationsProcessorService.",
                    from: "D",
                    to: "C",
                    direction: "reverse",
                    details: "MongoDB Production <strong>cls_ver2 (D)</strong> trả về dữ liệu tài liệu nhị phân đã nén. RelationsProcessorService thực hiện giải nén trường <code>cls_parsing</code> bằng Gzip trên RAM.",
                    code: "raw_xml = gzip.decompress(doc['cls_parsing'])\ndata_parsing = json.loads(raw_xml)"
                },
                {
                    id: "4",
                    num: "Bước 4",
                    title: "Yêu cầu bóc tách quan hệ thô",
                    desc: "RelationsProcessorService gọi RelationsExtractor.",
                    from: "C",
                    to: "E",
                    direction: "forward",
                    details: "RelationsProcessorService (C) phân chia các tài liệu đã giải nén sang cho các luồng xử lý riêng biệt của <strong>RelationsExtractor (E)</strong> để tiến hành bóc tách cues câu từ.",
                    code: "extractor = self.thread_local.extractor\nrelations = extractor.extract(doc)"
                },
                {
                    id: "5a",
                    num: "Bước 5a",
                    title: "Gửi câu sang Rule-based Resolver",
                    desc: "RelationsExtractor gọi Rule-based Resolver.",
                    from: "E",
                    to: "E1",
                    direction: "forward",
                    details: "RelationsExtractor (E) gửi các câu trong điều khoản qua bộ lọc quy tắc <strong>Rule-based Resolver (E1)</strong> nhằm thực hiện lọc nhiễu ngữ cảnh (DistractorFilter) và phân giải tham chiếu nội bộ.",
                    code: "raw_relations = rule_resolver.resolve_internal_refs(clauses)"
                },
                {
                    id: "5b",
                    num: "Bước 5b",
                    title: "Trả về quan hệ thô từ quy tắc",
                    desc: "Rule-based Resolver trả về quan hệ thô tìm được bằng Regex.",
                    from: "E1",
                    to: "E",
                    direction: "reverse",
                    details: "<strong>Rule-based Resolver (E1)</strong> trả về danh sách các quan hệ thô dựa trên các mẫu Regex cues pháp lý, liên kết trực tiếp các từ khóa cues với văn bản tham chiếu thô.",
                    code: "[{'relationship': 'sua_doi', 'target': 'Luật Đất đai 2013'}]"
                },
                {
                    id: "6a",
                    num: "Bước 6a",
                    title: "Kích hoạt LLM Fallback",
                    desc: "RelationsExtractor gửi context sang Fallback LLM.",
                    from: "E",
                    to: "F",
                    direction: "forward",
                    details: "Khi điểm tự tin của quy tắc Regex thấp hoặc câu có ngữ nghĩa phức tạp, RelationsExtractor gửi nội dung điều khoản sang <strong>LangExtractFallback LLM (F)</strong> để phân tích ngữ nghĩa sâu.",
                    code: "payload = {'prompt': f'Extract legal relations: {clause_text}'}\nfuture = thread_pool.submit(call_llm_api, payload)"
                },
                {
                    id: "6b",
                    num: "Bước 6b",
                    title: "Trả về quan hệ từ LLM",
                    desc: "LLM trả kết quả chuẩn hóa JSON về cho RelationsExtractor.",

        let activePhase = 1;

        // Populate step timeline on load
        function populateStepTimeline() {
            const container = document.getElementById("step-list-container");
            container.innerHTML = "";

            currentSteps.forEach(step => {
                const item = document.createElement("div");
                item.className = "step-item";
                item.id = `step-item-${step.id}`;
                item.onclick = () => highlightStep(step.id);

                item.innerHTML = `
                    <div class="step-number">${step.id}</div>
                    <div class="step-text">
                        <div class="step-title">${step.title}</div>
                        <div class="step-desc">${step.desc}</div>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        // Populate architecture node grid
        function populateNodes() {
            const container = document.getElementById("graph-container");
            container.innerHTML = "";

            // Adjust grid columns template based on phase nodes size to make it look clean
            if (activePhase === 1) {
                container.style.gridTemplateColumns = "repeat(4, 1fr)";
            } else {
                container.style.gridTemplateColumns = "repeat(4, 1fr)";
            }

            currentNodes.forEach(node => {
                const card = document.createElement("div");
                card.className = `node-card ${node.class}`;
                card.id = `node-${node.id}`;

                let badge = "";
                if (node.type === "mongo") badge = `<span class="badge-type badge-mongo">Mongo</span>`;
                if (node.type === "neo4j") badge = `<span class="badge-type badge-neo4j">Neo4j</span>`;
                if (node.type === "file") badge = `<span class="badge-type badge-file">File</span>`;

                card.innerHTML = `
                    <div class="node-label">${node.label} ${badge}</div>
                    <div class="node-name">${node.name}</div>
                `;
                container.appendChild(card);
            });
        }

        // Draw connection lines in SVG layer
        function drawAllConnections() {
            const svgLayer = document.getElementById("svg-layer");
            svgLayer.innerHTML = ""; // Clear existing lines

            const activeStep = document.querySelector(".step-item.active");
            if (!activeStep) return;

            const stepId = activeStep.id.replace("step-item-", "");
            const step = currentSteps.find(s => s.id === stepId);
            if (!step) return;

            const fromNodeEl = document.getElementById(`node-${step.from}`);
            const toNodeEl = document.getElementById(`node-${step.to}`);

            if (!fromNodeEl || !toNodeEl) return;

            const rectFrom = fromNodeEl.getBoundingClientRect();
            const rectTo = toNodeEl.getBoundingClientRect();
            const rectSvg = svgLayer.getBoundingClientRect();

            // Calculate center coordinates relative to SVG container
            const fromX = rectFrom.left + rectFrom.width / 2 - rectSvg.left;
            const fromY = rectFrom.top + rectFrom.height / 2 - rectSvg.top;
            const toX = rectTo.left + rectTo.width / 2 - rectSvg.left;
            const toY = rectTo.top + rectTo.height / 2 - rectSvg.top;

            // Draw beautiful curved bezier path
            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            
            // Generate nice control points for curved visual flow lines
            const dx = Math.abs(toX - fromX);
            const dy = Math.abs(toY - fromY);
            let dString = "";

            if (dy < 20) {
                // Horizontal flow
                dString = `M ${fromX} ${fromY} C ${fromX + dx/2} ${fromY}, ${toX - dx/2} ${toY}, ${toX} ${toY}`;
            } else if (dx < 20) {
                // Vertical flow
                dString = `M ${fromX} ${fromY} C ${fromX} ${fromY + dy/2}, ${toX} ${toY - dy/2}, ${toX} ${toY}`;
            } else {
                // Diagonal curved flow
                dString = `M ${fromX} ${fromY} C ${fromX + dx/2} ${fromY}, ${toX - dx/2} ${toY}, ${toX} ${toY}`;
            }

            path.setAttribute("d", dString);
            
            // Set direction color based on direction parameter
            if (step.direction === "reverse") {
                path.setAttribute("class", "active reverse");
            } else {
                path.setAttribute("class", "active");
            }

            svgLayer.appendChild(path);
        }

        // Highlight selected step
        function highlightStep(stepId) {
            // Remove active states from all step items
            document.querySelectorAll(".step-item").forEach(item => item.classList.remove("active"));
            
            // Set active state on clicked step item
            const activeItem = document.getElementById(`step-item-${stepId}`);
            if (activeItem) {
                activeItem.classList.add("active");
                // Scroll timeline panel to keep highlighted step in view
                activeItem.scrollIntoView({ behavior: "smooth", block: "nearest" });
            }

            const step = currentSteps.find(s => s.id === stepId);
            if (!step) return;

            // Highlight corresponding nodes in grid
            document.querySelectorAll(".node-card").forEach(node => {
                node.classList.remove("active", "source", "target");
            });

            const fromNode = document.getElementById(`node-${step.from}`);
            const toNode = document.getElementById(`node-${step.to}`);

            if (fromNode) {
                fromNode.classList.add("active");
                if (step.direction === "reverse") {
                    fromNode.classList.add("target");
                } else {
                    fromNode.classList.add("source");
                }
            }

            if (toNode) {
                toNode.classList.add("active");
                if (step.direction === "reverse") {
                    toNode.classList.add("source");
                } else {
                    toNode.classList.add("target");
                }
            }

            // Draw line
            setTimeout(drawAllConnections, 50);

            // Populate inspector details panel
            const detailsContainer = document.getElementById("details-panel-content");
            
            const fromNodeName = currentNodes.find(n => n.id === step.from)?.name || step.from;
            const toNodeName = currentNodes.find(n => n.id === step.to)?.name || step.to;

            let arrowIcon = "➔";
            if (step.direction === "reverse") {
                arrowIcon = "⇠";
            }

            detailsContainer.innerHTML = `
                <div class="details-header">
                    <span class="details-step-num">${step.num}</span>
                    <h3 class="details-title">${step.title}</h3>
                </div>
                <div class="details-direction">
                    <span class="comp-pill">${fromNodeName}</span>
                    <span>${arrowIcon}</span>
                    <span class="comp-pill">${toNodeName}</span>
                </div>
                <div class="details-body">
                    <p>${step.details}</p>
                </div>
                ${step.code ? `
                    <div class="details-header" style="margin-top: 10px;">
                        <span class="details-step-num" style="background: rgba(88, 235, 211, 0.15); color: #58ebd3; border-color: rgba(88, 235, 211, 0.2)">Truy vấn / Lệnh thực thi</span>
                    </div>
                    <pre class="code-block"><code>${step.code}</code></pre>
                ` : ""}
            `;
        }

        // Switch between Phase 1 and Phase 2 visualization
        function switchPhase(phase) {
            activePhase = phase;
            
            // Toggle active classes on header buttons
            document.getElementById("btn-p1").classList.toggle("active", phase === 1);
            document.getElementById("btn-p2").classList.toggle("active", phase === 2);

            // Update state
            if (phase === 1) {
                document.getElementById("timeline-title").innerText = dataPhase1.title;
                currentSteps = dataPhase1.steps;
                currentNodes = dataPhase1.nodes;
            } else {
                document.getElementById("timeline-title").innerText = dataPhase2.title;
                currentSteps = dataPhase2.steps;
                currentNodes = dataPhase2.nodes;
            }

            // Redraw everything
            populateStepTimeline();
            populateNodes();

            // Clear inspector panel
            document.getElementById("details-panel-content").innerHTML = `
                <div class="empty-state">
                    <svg viewBox="0 0 24 24" stroke="currentColor">
                        <circle cx="12" cy="12" r="9"></circle>
                        <path d="M12 8v4M12 16h.01"></path>
                    </svg>
                    <p>Chọn một bước ở thanh bên để thanh sát chi tiết luồng xử lý và dữ liệu truy vấn.</p>
                </div>
            `;

            // Clear SVG layer
            document.getElementById("svg-layer").innerHTML = "";

            // Highlight first step automatically
            if (currentSteps.length > 0) {
                highlightStep(currentSteps[0].id);
            }
        }

        // Redraw SVG connectors on window resize to ensure responsiveness
        window.addEventListener("resize", () => {
            drawAllConnections();
        });

        // Initialize view on load
        window.onload = () => {
            switchPhase(1);
        };
